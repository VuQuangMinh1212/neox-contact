on:
  push:
    branches:
      - deploy/develop
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: mv1212/neox-contact:latest
          cache-from: type=registry,ref=mv1212/neox-contact:latest
          cache-to: type=inline

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -p 2250 -H quangminh1212.ddns.net >> ~/.ssh/known_hosts

      - name: Connect, Pull, and Build Docker
        run: |
          ssh -p 2250 quangminh@quangminh1212.ddns.net << EOF
            set -e
            cd /home/quangminh/next
            echo "${{ secrets.SSH_PASS }}" | sudo -S docker compose pull neox-contact
            echo "${{ secrets.SSH_PASS }}" | sudo -S docker compose up -d
          EOF
